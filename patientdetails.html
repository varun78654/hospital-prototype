<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Patient Details</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#0f9d58,#34a853);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

/* CONTAINER */
.box{
background:white;
color:black;
padding:25px;
border-radius:15px;
width:340px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
animation:slideUp 0.8s ease;
}

@keyframes slideUp{
from{transform:translateY(80px); opacity:0;}
to{transform:translateY(0); opacity:1;}
}

h2{
color:#0f9d58;
}

/* INPUT */
input{
width:90%;
padding:10px;
margin:10px 0;
border-radius:6px;
border:1px solid #ccc;
}

/* VIDEO */
video, canvas{
width:100%;
border-radius:10px;
margin-top:10px;
}

/* BUTTON */
button{
padding:10px 20px;
border:none;
border-radius:6px;
background:#0f9d58;
color:white;
cursor:pointer;
margin-top:12px;
}

button:hover{
background:#0c7c45;
}

</style>
</head>

<body>

<div class="box">

<h2>Patient Details</h2>

<input id="hospital" placeholder="Hospital Name">

<input id="name" placeholder="Enter Your Name">

<input id="phone" placeholder="Mobile Number" readonly>

<video id="video" autoplay muted></video>
<canvas id="canvas" style="display:none;"></canvas>

<button onclick="capturePhoto()">Capture Photo</button>

<button onclick="login()">Login</button>

</div>

<script>

/* AUTO FILL PHONE */
let phone = localStorage.getItem("userPhone")
if(phone){
document.getElementById("phone").value = phone
}

/* START CAMERA */
let video = document.getElementById("video")

navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>{
video.srcObject = stream

/* AUTO CAPTURE */
setTimeout(capturePhoto,2000)

})

/* CAPTURE PHOTO */
function capturePhoto(){

let canvas = document.getElementById("canvas")
let ctx = canvas.getContext("2d")

canvas.width = video.videoWidth
canvas.height = video.videoHeight

ctx.drawImage(video,0,0)

let imageData = canvas.toDataURL("image/png")

localStorage.setItem("patientPhoto", imageData)

alert("Photo Captured ✔")

}

/* LOGIN */
function login(){

let hospital = document.getElementById("hospital").value
let name = document.getElementById("name").value
let phone = document.getElementById("phone").value

if(hospital=="" || name==""){
alert("Please fill all details")
return
}

/* STORE DATA */
let data={
hospital:hospital,
name:name,
phone:phone
}

localStorage.setItem("patientDetails", JSON.stringify(data))

alert("Login Successful")

window.location.href="patientdashboard.html"

}

</script>

</body>
</html>
