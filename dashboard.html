<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CareJR Dashboard</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f4f4;
overflow-y:auto;
}

/* HEADER */

.header{
background:#0f9d58;
color:white;
padding:15px 20px;
display:flex;
align-items:center;
justify-content:space-between;
position:relative;
}

/* HAMBURGER */

.menu-icon{
font-size:24px;
cursor:pointer;
}

/* SIDE MENU */

.sidebar{
position:fixed;
top:0;
left:-250px;
width:250px;
height:100%;
background:#0f9d58;
color:white;
padding-top:60px;
transition:0.4s;
z-index:10;
}

.sidebar a{
display:block;
padding:15px;
text-decoration:none;
color:white;
}

.sidebar a:hover{
background:#0c7c45;
}

.sidebar.active{
left:0;
}

/* HEADER RIGHT MENU */

.top-links span{
margin:0 10px;
cursor:pointer;
}

/* TOP CARD */

.top-card{
background:white;
margin:20px;
padding:20px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

/* NAME ROW */

.name-row{
display:flex;
justify-content:space-between;
align-items:center;
}

/* HOSPITAL STYLE */

.hospital{
color:#0f9d58;
font-size:26px;
font-weight:bold;
text-decoration:underline;
text-shadow:2px 2px 6px rgba(0,0,0,0.3);
letter-spacing:1px;
padding-right:20px;
}

/* GRID */

.grid{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
padding:20px;
}

/* CARD */

.card{
width:220px;
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
transition:0.3s;
text-align:center;
}

.card img{
width:100%;
height:150px;
object-fit:cover;
}

.card p{
padding:10px;
font-weight:bold;
}

/* HOVER */

.card:hover{
transform:translateY(-10px);
border:2px solid #0f9d58;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

/* SECTION TITLE */

.section-title{
text-align:center;
font-size:22px;
color:#0f9d58;
margin-top:20px;
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
<a href="newdata.html">New Data</a>
<a href="previousdata.html">Previous Data</a>
<a href="#">Bills</a>
<a href="#">Emergency Numbers: 102 / 108</a>
</div>

<!-- HEADER -->
<div class="header">

<div class="menu-icon" onclick="toggleMenu()">☰</div>

<div><b>CareJR Dashboard</b></div>

<div class="top-links">
<span>Our Services</span>
<span>About Us</span>
<span>Doctors</span>
<span>Emergency</span>
</div>

</div>

<!-- TOP INFO -->
<div class="top-card">

<div class="name-row">
<h2 id="name"></h2>
<div class="hospital" id="hospital"></div>
</div>

<p><b>Doctor:</b> <span id="doctor"></span></p>

</div>

<!-- SERVICES -->
<div class="section-title">Our Services</div>

<div class="grid">

<div class="card">
<img src="https://images.unsplash.com/photo-1588776814546-1ffcf47267a5">
<p>ECG Service</p>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1580281658629-8f6c5c3b75a9">
<p>Radiology Service</p>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1587854692152-cbe660dbde88">
<p>Pharmacy</p>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1600959907703-125ba1374a12">
<p>Ambulance (102)</p>
</div>

</div>

<!-- DOCTORS -->
<div class="section-title">Doctors List</div>

<div class="grid">

<div class="card">
<img src="https://images.unsplash.com/photo-1537368910025-700350fe46c7">
<p>Dr. Meena - Cardiologist</p>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1550831107-1553da8c8464">
<p>Dr. Abhishek - General Physician</p>
</div>

</div>

<script>

/* LOAD DATA */

let data=JSON.parse(localStorage.getItem("patientDetails"))

if(data){

document.getElementById("name").innerText="Patient: "+data.name
document.getElementById("hospital").innerText=data.hospital

/* doctor = logged user name */
document.getElementById("doctor").innerText=data.name

}

/* MENU TOGGLE */

function toggleMenu(){
document.getElementById("sidebar").classList.toggle("active")
}

</script>

</body>
</html>
